[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-diagram"
version = "0.1.0"
description = "Evidence-grounded Chinese architecture, sequence, and flow diagrams"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "jsonschema>=4"]

[project.scripts]
architecture-diagram = "architecture_diagram.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
architecture_diagram = ["scripts/*.mjs"]

[tool.setuptools.data-files]
"share/architecture-diagram" = ["skills/architecture-diagram/SKILL.md"]
"share/architecture-diagram/schemas" = ["schemas/diagram.schema.json", "schemas/analysis.schema.json"]
"share/architecture-diagram/references" = ["references/analysis-stages.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=tests/.pytest-tmp"
